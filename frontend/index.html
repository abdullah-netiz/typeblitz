<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TypeBlitz — Minimalist Typing Speed & Cadence Test</title>
    
    <!-- Primary SEO Meta Tags -->
    <meta name="description" content="TypeBlitz is a sleek, fast typing speed and cadence test. Track your WPM, raw speed, accuracy, and keystroke consistency with tactile switch audio and dev syntax modes." />
    <meta name="keywords" content="typing test, speed test, wpm test, typing speed, typeblitz, keyboard test, typing practice, words per minute, developer typing, monkeytype alternative" />
    <meta name="author" content="TypeBlitz" />
    <meta name="theme-color" content="#0b0f19" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.typeblitz.app/" />

    <!-- Robots Meta (Allow all search engines & rich snippets) -->
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

    <!-- Open Graph / Facebook / Discord -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.typeblitz.app/" />
    <meta property="og:title" content="TypeBlitz — Minimalist Typing Speed & Cadence Test" />
    <meta property="og:description" content="Test your typing speed and accuracy with customizable dark themes, mechanical switch audio, code snippet modes, and ergonomic post-test heatmaps." />
    <meta property="og:site_name" content="TypeBlitz" />
    <meta property="og:image" content="https://www.typeblitz.app/favicon.svg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:url" content="https://www.typeblitz.app/" />
    <meta name="twitter:title" content="TypeBlitz — Minimalist Typing Speed & Cadence Test" />
    <meta name="twitter:description" content="Test your typing speed and accuracy with customizable dark themes, mechanical switch audio, code snippet modes, and ergonomic post-test heatmaps." />
    <meta name="twitter:image" content="https://www.typeblitz.app/favicon.svg" />

    <!-- JSON-LD Structured Data for Google Rich Snippets -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "TypeBlitz",
      "url": "https://www.typeblitz.app",
      "description": "A sleek, minimalist typing speed test to measure WPM, accuracy, and keystroke cadence with mechanical keyboard audio and custom dark themes.",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "All",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
